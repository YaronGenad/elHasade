groups:
  - name: alhasade_alerts
    rules:

      # ── Error rate ──────────────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate (>5%)"
          description: "More than 5% of requests are returning 5xx errors for the last 2 minutes."

      # ── Latency p95 ────────────────────────────────────────────────────────────
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
          > 3.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency (>3s)"
          description: "95th percentile HTTP request latency is above 3 seconds for 5 minutes."

      # ── Service down ────────────────────────────────────────────────────────────
      - alert: BackendDown
        expr: up{job="alhasade-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Al-Hasade backend is down"
          description: "Prometheus cannot scrape the backend /metrics endpoint for 1 minute."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis exporter is down"
          description: "Prometheus cannot scrape the Redis exporter for 2 minutes."

      # ── Generation failures ─────────────────────────────────────────────────────
      - alert: HighGenerationFailureRate
        expr: |
          (
            sum(rate(http_requests_total{endpoint="/generations/",status_code=~"5.."}[10m]))
            /
            sum(rate(http_requests_total{endpoint="/generations/"}[10m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High generation failure rate (>10%)"
          description: "More than 10% of generation requests are failing."
