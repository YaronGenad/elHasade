name: CI / CD — Al-Hasade Production Deploy

# Triggers on every push to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ── Job 1: Run backend test suite ──────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: test_alhasade
          POSTGRES_USER: alhasade
          POSTGRES_PASSWORD: alhasade
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pip-audit (dependency security scan)
        run: pip-audit --strict --desc on -r backend/requirements.txt
        continue-on-error: false

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://alhasade:alhasade@localhost:5432/test_alhasade
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
        run: alembic upgrade head

      - name: Run auth tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_alhasade_ci.db
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          AUTH_RATE_LIMIT: "1000/minute"
          GENERATION_RATE_LIMIT: "1000/minute"
        run: pytest test_auth_complete.py -v

      - name: Run cache/search tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_alhasade_ci.db
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          AUTH_RATE_LIMIT: "1000/minute"
          GENERATION_RATE_LIMIT: "1000/minute"
        run: pytest test_cache_search.py -v

      - name: Run generation tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_alhasade_ci.db
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          AUTH_RATE_LIMIT: "1000/minute"
          GENERATION_RATE_LIMIT: "1000/minute"
        run: pytest test_generations_complete.py -v

      - name: Run approval loop tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_alhasade_ci.db
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          AUTH_RATE_LIMIT: "1000/minute"
          GENERATION_RATE_LIMIT: "1000/minute"
        run: pytest test_approval_loop.py -v

      - name: Run security tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_alhasade_ci.db
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          AUTH_RATE_LIMIT: "1000/minute"
          GENERATION_RATE_LIMIT: "1000/minute"
        run: pytest test_security.py -v

  # ── Job 2: Run frontend tests & audit ──────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (dependency security scan)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Job 3: Build and push Docker images ───────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Only build+push on main branch (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}/api

  # ── Job 4: Deploy to LightSail ─────────────────────────────────────────────
  deploy:
    name: Deploy to LightSail
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://${{ secrets.DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx.conf"
          target: "~/alhasade"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/alhasade

            # ── Save current image tags for rollback ──
            PREV_BACKEND=$(docker inspect --format='{{.Config.Image}}' alhasade-backend-1 2>/dev/null || echo "none")
            PREV_FRONTEND=$(docker inspect --format='{{.Config.Image}}' alhasade-frontend-1 2>/dev/null || echo "none")
            echo "Previous backend:  $PREV_BACKEND"  > .rollback-tags
            echo "Previous frontend: $PREV_FRONTEND" >> .rollback-tags

            # ── Log in to GHCR ──
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull latest images ──
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            # ── Deploy with zero-downtime rolling restart ──
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # ── Run DB migrations ──
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              exec -T backend alembic upgrade head

            # ── Verify health ──
            sleep 10
            if ! curl -sf https://${{ secrets.DOMAIN }}/health | grep -q healthy; then
              echo "::error::Health check failed! Initiating rollback..."

              # ── Rollback: restore previous images ──
              if [ "$PREV_BACKEND" != "none" ]; then
                docker compose -f docker-compose.prod.yml --env-file .env.prod down
                docker tag "$PREV_BACKEND" "${{ env.IMAGE_BACKEND }}:latest" 2>/dev/null || true
                docker tag "$PREV_FRONTEND" "${{ env.IMAGE_FRONTEND }}:latest" 2>/dev/null || true
                docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
                echo "Rollback completed — reverted to previous images."
              fi
              exit 1
            fi

            echo "Deploy successful! (${{ github.sha }})"

      # ── Rollback instructions (manual) ──
      # To manually rollback to a previous version:
      #   1. SSH into the server: ssh $LIGHTSAIL_USER@$LIGHTSAIL_HOST
      #   2. cd ~/alhasade
      #   3. cat .rollback-tags  (shows previous image tags)
      #   4. docker compose -f docker-compose.prod.yml --env-file .env.prod down
      #   5. docker tag <previous-backend-tag> $IMAGE_BACKEND:latest
      #   6. docker tag <previous-frontend-tag> $IMAGE_FRONTEND:latest
      #   7. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
      #   8. Verify: curl -sf https://$DOMAIN/health
      # Note: DB migrations are NOT automatically rolled back. Use:
      #   docker compose exec -T backend alembic downgrade -1

      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Deployment to production SUCCEEDED (${{ github.sha }})"
          # Slack notification — requires SLACK_WEBHOOK_URL secret in GitHub repo settings
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"text":"✅ Al-Hasade deployed successfully\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"}' || true
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to production FAILED. Check logs above."
          # Slack notification — requires SLACK_WEBHOOK_URL secret in GitHub repo settings
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"text":"❌ Al-Hasade deployment FAILED\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true
          fi
