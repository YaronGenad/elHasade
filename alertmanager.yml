# ── AlertManager configuration (Sprint 5) ─────────────────────────────────────
# Basic routing: critical → webhook (PagerDuty/Slack), warning → email.
# Replace placeholder URLs/addresses before production use.

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@alhasade.edu'
  # smtp_auth_username: 'alertmanager@alhasade.edu'
  # smtp_auth_password: '<secret>'

route:
  receiver: default-webhook
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: critical-webhook
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: default-webhook
      repeat_interval: 4h

receivers:

  - name: default-webhook
    webhook_configs:
      - url: 'http://localhost:5001/webhook/alerts'
        send_resolved: true
    # email_configs:
    #   - to: 'ops@alhasade.edu'
    #     send_resolved: true

  - name: critical-webhook
    webhook_configs:
      - url: 'http://localhost:5001/webhook/alerts'
        send_resolved: true
    # email_configs:
    #   - to: 'oncall@alhasade.edu'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
