# ── Al-Hasade HTTP-only Nginx Configuration ────────────────────────────────────
# Used for test deployments without a domain (IP only, no SSL).
# Switch to nginx.conf + init-ssl.sh once a domain is available.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss application/atom+xml
               image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=gen_limit:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        location /health-nginx {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            rewrite ^/api(/.*)$ $1 break;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            location /api/auth/ {
                rewrite ^/api(/.*)$ $1 break;
                limit_req zone=auth_limit burst=5 nodelay;
                proxy_pass http://backend;
            }
            location /api/generations/ {
                rewrite ^/api(/.*)$ $1 break;
                limit_req zone=gen_limit burst=3 nodelay;
                proxy_pass http://backend;
            }
            location /api/search/ {
                rewrite ^/api(/.*)$ $1 break;
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://backend;
            }
        }

        location ~ ^/(health|metrics)$ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            access_log off;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://frontend;
                expires    1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
